<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">MacCleanUp</title>
  <desc id="banner-desc">See where your Mac's disk space goes, and clear only what you review.</desc>
  <rect width="1280" height="320" fill="#000000"/>
  <rect x="0" y="0" width="14" height="320" fill="#C00027"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="96" y="170" fill="#F4BD47" font-size="104" font-weight="700" letter-spacing="-2">MacCleanUp</text>
    <text x="100" y="228" fill="#FFFFFF" font-size="30">Where your disk space goes, and what is safe to clear</text>
  </g>
  <g transform="translate(1000 128)">
    <rect x="0" y="0" width="184" height="40" rx="8" fill="#FFFFFF" fill-opacity="0.12"/>
    <rect x="0" y="0" width="46" height="40" rx="8" fill="#C00027"/>
    <rect x="50" y="0" width="58" height="40" fill="#F4BD47"/>
    <rect x="112" y="0" width="30" height="40" fill="#F4BD47" fill-opacity="0.6"/>
    <rect x="146" y="0" width="16" height="40" fill="#FFFFFF" fill-opacity="0.45"/>
    <rect x="0" y="56" width="120" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.25"/>
    <rect x="0" y="80" width="88" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.15"/>
  </g>
</svg>
